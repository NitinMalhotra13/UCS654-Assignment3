[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "topsis-nitin-102303918"
version = "0.1.0"
description = "TOPSIS CLI Tool"
authors = [
  { name = "Nitin Malhotra" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "pandas",
  "numpy",
  "openpyxl"
]

[project.scripts]
topsis = "topsis.cli:main"

[tool.setuptools.packages.find]
where = ["."]